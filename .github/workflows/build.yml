name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a main run: it may be the one publishing a release. Pushes to main queue instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Release build (arm64)
    runs-on: macos-26          # Apple Silicon runner with Xcode 26 preinstalled
    timeout-minutes: 30
    permissions:
      contents: write          # only used to tag and attach the release assets to a GitHub Release

    # The signing mode (ad-hoc / Apple Development / Developer ID) is decided by the certificate in SIGNING_P12;
    # what each mode buys users and how to create these secrets is documented in README → Signing and
    # README → Signing secrets. APPLE_ID and APPLE_APP_PASSWORD are only read for Developer ID notarization.
    env:
      SIGNING_P12: ${{ secrets.SIGNING_P12 }}
      SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APP: build/Build/Products/Release/Dicta.app
      # NB: $RUNNER_TEMP, not ${{ runner.temp }} — the `runner` context is not available in job-level `env`,
      # and referencing it there makes GitHub reject the whole workflow before any job starts.
      KEYCHAIN: signing.keychain-db

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history: CFBundleVersion is the commit count

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --quiet

      # version = MARKETING_VERSION from project.yml (CFBundleShortVersionString)
      # build   = commit count (CFBundleVersion) — monotonic on main, what Sparkle compares
      # sparkle = the pinned Sparkle package version, so the appcast tools match the framework in the app
      # On v* tags the tag must match the version, or the release would ship under the wrong name.
      #
      # release = "this run publishes". A push to main whose MARKETING_VERSION has no v<version> tag yet is a
      # release: CI tags it itself (see *Tag release*), so merging a version-bump PR is the entire release ritual
      # and nothing has to be run locally. Any other push to main just re-tags nothing and uploads an artifact.
      - name: Read version
        id: version
        run: |
          # scripts/version.sh validates and fails the step with an ::error:: annotation if project.yml is off.
          VERSION=$(scripts/version.sh version)
          SPARKLE=$(scripts/version.sh sparkle)
          BUILD=$(scripts/version.sh build)
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match MARKETING_VERSION $VERSION in project.yml"
            exit 1
          fi
          RELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE=true                                   # tag pushed by hand (or by `make release`)
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && ! git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            RELEASE=true                                   # version bump just landed on main
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "sparkle=${SPARKLE}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Dicta ${VERSION} (build ${BUILD}, ${GITHUB_SHA::7}) release=${RELEASE}"

      - name: Import signing certificate
        id: signing
        run: |
          if [[ -z "$SIGNING_P12" || -z "$APPLE_TEAM_ID" ]]; then
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "::notice::No SIGNING_P12/APPLE_TEAM_ID secrets — building ad-hoc signed. See README → Opening a non-notarized build."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/$KEYCHAIN"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          if ! security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$SIGNING_P12_PASSWORD" \
               -T /usr/bin/codesign -T /usr/bin/security; then
            rm -f "$RUNNER_TEMP/cert.p12"
            echo "::error::Could not import SIGNING_P12 — the SIGNING_P12_PASSWORD secret must match the password used when exporting the .p12 from Keychain Access."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # shellcheck disable=SC2046  # intentional split: keep the existing keychains in the search list
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITIES=$(security find-identity -v -p codesigning "$KEYCHAIN")
          echo "$IDENTITIES"
          if grep -q "Developer ID Application" <<< "$IDENTITIES"; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
            echo "identity=Developer ID Application" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing with Developer ID (team $APPLE_TEAM_ID)"
          elif grep -q "Apple Development" <<< "$IDENTITIES"; then
            echo "mode=apple-development" >> "$GITHUB_OUTPUT"
            echo "identity=Apple Development" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing with Apple Development (team $APPLE_TEAM_ID) — stable identity, not notarized"
          else
            echo "::error::SIGNING_P12 contains no 'Developer ID Application' or 'Apple Development' identity"
            exit 1
          fi

      # xcbeautify is preinstalled on GitHub's macOS images. To run this locally, `brew install xcbeautify`
      # or drop the `| xcbeautify …` pipe. The three modes differ only in the signing overrides:
      #   ad-hoc            identity "-", no team
      #   Apple Development identity + team
      #   Developer ID      same, plus --timestamp (required for notarization)
      # The team-pinned designated requirement is applied in the next step, after Xcode's own signing.
      - name: Build (Release)
        env:
          MODE: ${{ steps.signing.outputs.mode }}
          IDENTITY: ${{ steps.signing.outputs.identity || '-' }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -o pipefail
          TEAM=""
          [[ "$MODE" == "adhoc" ]] || TEAM="$APPLE_TEAM_ID"
          EXTRA=""
          [[ "$MODE" == "developer-id" ]] && EXTRA="--timestamp"
          xcodebuild \
            -project Dicta.xcodeproj \
            -scheme Dicta \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            DICTA_CODESIGN_EXTRA="$EXTRA" \
            build | xcbeautify --renderer github-actions || exit "${PIPESTATUS[0]}"

      # Re-signs the outer bundle with the team-pinned requirement (no-op for ad-hoc). Must precede notarization.
      - name: Pin designated requirement
        env:
          MODE: ${{ steps.signing.outputs.mode }}
        run: |
          EXTRA=()
          [[ "$MODE" == "developer-id" ]] && EXTRA=(--timestamp)
          scripts/pin-designated-requirement.sh "$APP" "${EXTRA[@]}"

      - name: Notarize and staple
        if: steps.signing.outputs.mode == 'developer-id' && env.APPLE_ID != ''
        run: |
          ditto -c -k --keepParent --sequesterRsrc "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait --timeout 20m
          xcrun stapler staple "$APP"

      - name: Verify bundle
        env:
          MODE: ${{ steps.signing.outputs.mode }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          PLIST="$APP/Contents/Info.plist"
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST")
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$PLIST")
          echo "CFBundleShortVersionString=$SHORT CFBundleVersion=$BUNDLE"
          [[ "$SHORT" == "$VERSION" && "$BUNDLE" == "$BUILD" ]] \
            || { echo "::error::Info.plist versions do not match expected $VERSION ($BUILD)"; exit 1; }
          lipo -info "$APP/Contents/MacOS/Dicta"
          # The same gate `make dist` runs, so the local and CI release checks cannot drift apart.
          scripts/verify-bundle.sh "$APP" "$MODE" "$APPLE_TEAM_ID"
          du -sh "$APP"

      - name: Package
        env:
          MODE: ${{ steps.signing.outputs.mode }}
          RELEASE: ${{ steps.version.outputs.release }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          # Releases get the predictable name the Sparkle appcast will point at; other runs keep the sha.
          if [[ "$RELEASE" == true ]]; then
            ARTIFACT="Dicta-${VERSION}"
          else
            ARTIFACT="Dicta-${VERSION}-${SHA}"
          fi
          [[ "$MODE" == "adhoc" ]] && ARTIFACT="${ARTIFACT}-adhoc"
          mkdir -p dist
          ditto -c -k --keepParent --sequesterRsrc "$APP" "dist/${ARTIFACT}.zip"
          ls -la dist
          echo "name=${ARTIFACT}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.name }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0   # already a zip

      # Sparkle's feed (SUFeedURL) is .../releases/latest/download/appcast.xml, which always redirects to the
      # newest non-prerelease's copy — so one item per release is enough and each tag ships its own appcast.
      # Skipped for ad-hoc builds: Sparkle refuses an update whose signing identity differs from the running app.
      - name: Generate appcast
        if: steps.version.outputs.release == 'true' && steps.signing.outputs.mode != 'adhoc'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_VERSION: ${{ steps.version.outputs.sparkle }}   # same release as the framework in the app
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || { echo "::error::SPARKLE_PRIVATE_KEY secret missing"; exit 1; }
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          # No deltas: a single-item feed has nothing to delta against.
          echo "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}/releases" \
            --maximum-deltas 0 \
            -o dist/appcast.xml dist
          cat dist/appcast.xml

      # Catches the ways a release can look fine and still be uninstallable: an enclosure URL that does not name
      # the zip actually attached, a sparkle:version that is not this build, or an appcast signed with a key the
      # shipped app does not trust (SPARKLE_PRIVATE_KEY rotated without updating SUPublicEDKey, or vice versa).
      - name: Verify appcast
        if: steps.version.outputs.release == 'true' && steps.signing.outputs.mode != 'adhoc'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ steps.version.outputs.tag }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          ZIPS=(dist/Dicta-*.zip)
          [[ ${#ZIPS[@]} -eq 1 ]] || { echo "::error::expected exactly one zip in dist, found ${ZIPS[*]}"; exit 1; }
          # A .dmg here would become the update enclosure (README → Releasing); the DMG is built into $RUNNER_TEMP.
          compgen -G 'dist/*.dmg' > /dev/null \
            && { echo "::error::a .dmg in dist/ would be picked up by generate_appcast — keep DMGs out of dist"; exit 1; }
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "${ZIPS[0]}")"
          grep -q "url=\"${URL}\"" dist/appcast.xml \
            || { echo "::error::appcast enclosure URL is not ${URL}"; exit 1; }
          grep -q "<sparkle:version>${BUILD}</sparkle:version>" dist/appcast.xml \
            || { echo "::error::appcast sparkle:version is not build ${BUILD}"; exit 1; }
          grep -q 'sparkle:edSignature="' dist/appcast.xml \
            || { echo "::error::appcast enclosure is not EdDSA-signed"; exit 1; }
          ( umask 077; printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/ed.key" )
          DERIVED=$(swift scripts/sparkle-public-key.swift "$RUNNER_TEMP/ed.key")
          rm -f "$RUNNER_TEMP/ed.key"
          EMBEDDED=$(/usr/libexec/PlistBuddy -c 'Print SUPublicEDKey' "$APP/Contents/Info.plist")
          [[ "$DERIVED" == "$EMBEDDED" ]] \
            || { echo "::error::SPARKLE_PRIVATE_KEY does not match SUPublicEDKey ($EMBEDDED) — installed copies would reject this release"; exit 1; }
          echo "appcast is signed with the key the app trusts ($EMBEDDED)"

      # The new-user download (README → Distribution). Runs *after* the appcast is generated and verified, and
      # writes outside dist, so the image can never become the Sparkle enclosure. Signing follows the app: ad-hoc
      # builds get an unsigned image.
      - name: Build DMG
        if: steps.version.outputs.release == 'true'
        env:
          MODE: ${{ steps.signing.outputs.mode }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NAME="Dicta-${VERSION}"
          ARGS=()
          [[ "$MODE" == "adhoc" ]] && NAME="${NAME}-adhoc"
          [[ "$MODE" == "developer-id" ]] && ARGS=(--timestamp)
          mkdir -p "$RUNNER_TEMP/dmg"
          scripts/make-dmg.sh "$APP" "$RUNNER_TEMP/dmg/${NAME}.dmg" "${ARGS[@]}"
          echo "DMG=$RUNNER_TEMP/dmg/${NAME}.dmg" >> "$GITHUB_ENV"

      # The image needs its own ticket — stapling the app inside does not staple the DMG (README → Signing secrets).
      - name: Notarize and staple DMG
        if: steps.version.outputs.release == 'true' && steps.signing.outputs.mode == 'developer-id' && env.APPLE_ID != ''
        run: |
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait --timeout 20m
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      # Last thing before publishing, so a failed build never leaves a tag behind and the run can just be re-run.
      # Skipped when the tag is what triggered this run. A tag pushed with GITHUB_TOKEN does not start another
      # workflow run, so this cannot loop.
      - name: Tag release
        if: steps.version.outputs.release == 'true' && !startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Dicta ${VERSION}"
          git push origin "$TAG"

      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.signing.outputs.mode }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # The DMG is the download for new users; the zip is what Sparkle serves to installed copies.
          INSTALL="**Install:** download the \`.dmg\`, open it, drag Dicta onto **Applications**."
          case "$MODE" in
            developer-id)      NOTE="$INSTALL Signed with Developer ID and notarized — opens normally." ;;
            apple-development) NOTE="$INSTALL Signed (Apple Development, not notarized), so the first launch needs one extra step: open it, then **System Settings → Privacy & Security → Open Anyway**. Permissions persist across updates." ;;
            *)                 NOTE="$INSTALL Ad-hoc signed. Run \`xattr -dr com.apple.quarantine /Applications/Dicta.app\` after copying it across; re-grant Accessibility after each update." ;;
          esac
          ASSETS=(dist/*.zip)
          [[ -n "${DMG:-}" && -f "$DMG" ]] && ASSETS+=("$DMG")
          if [[ -f dist/appcast.xml ]]; then
            ASSETS+=(dist/appcast.xml)
          else
            NOTE="${NOTE} No appcast is published for ad-hoc builds, so installed copies will not offer this release as an in-app update."
          fi
          # --notes is prepended to --generate-notes, which lists the PRs merged since the previous release.
          gh release create "$TAG" "${ASSETS[@]}" \
            --title "Dicta $TAG" \
            --notes "$NOTE" \
            --generate-notes \
            --verify-tag

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.mode != 'adhoc' && steps.signing.outputs.mode != ''
        run: security delete-keychain "$RUNNER_TEMP/$KEYCHAIN" || true
